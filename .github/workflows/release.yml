name: Release from main

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Automatically increment the highest stable version
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  version:
    runs-on: windows-2022
    timeout-minutes: 5
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - name: Require main branch
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if ($env:RELEASE_REF -ne 'refs/heads/main') {
            throw 'Releases must be dispatched from main.'
          }
      - name: Check out source and tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Calculate next version
        id: next
        env:
          VERSION_BUMP: ${{ inputs.bump }}
        run: python scripts\release_version.py --bump "$env:VERSION_BUMP" --output "$env:GITHUB_OUTPUT"
      - name: Require curated release notes
        env:
          RELEASE_VERSION: ${{ steps.next.outputs.version }}
        run: python scripts\check_release_notes.py --version "$env:RELEASE_VERSION"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: [version, build]
    runs-on: windows-2022
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out curated notes from tested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download verified executable
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: enshrouded-character-editor-windows-x64
          path: release-assets
      - name: Verify checksum and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          $exe = 'release-assets\enshrouded-character-editor-windows-x64.exe'
          $checksum = "$exe.sha256"
          $actual = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = (Get-Content -LiteralPath $checksum -Raw).Trim()
          if ($expected -ne "$actual  enshrouded-character-editor-windows-x64.exe") {
            throw 'Executable checksum verification failed.'
          }
          gh release create "$env:RELEASE_TAG" $exe $checksum `
            --target "$env:RELEASE_SHA" --title "$env:RELEASE_TAG - Enshrouded Character Workshop" `
            --notes-file "release-notes\$env:RELEASE_TAG.md" --draft
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation or asset upload failed.' }
          gh release edit "$env:RELEASE_TAG" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed; inspect the draft before retrying.' }
