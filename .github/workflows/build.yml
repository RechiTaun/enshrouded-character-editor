name: Build Windows executable

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Stable version embedded in the executable
        type: string
        default: "0.0.0"
        required: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q -x '(^|[\\/])(\.venv|build|dist)([\\/]|$)' .
      - name: Build and verify frozen executable
        env:
          BUILD_VERSION: ${{ inputs.version || '0.0.0' }}
        run: python scripts\build_executable.py --version "$env:BUILD_VERSION"
      - name: Upload executable and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: enshrouded-character-editor-windows-x64
          path: |
            dist/enshrouded-character-editor-windows-x64.exe
            dist/enshrouded-character-editor-windows-x64.exe.sha256
          if-no-files-found: error
          retention-days: 14
